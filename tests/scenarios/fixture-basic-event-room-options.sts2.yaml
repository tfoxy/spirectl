name: fixture-basic-event-room-options
description: Loads the checked-in event-room options fixture through the live bridge and asserts the resulting event-room screen.
steps:
  - dev.load-fixture:
      path: ../../fixtures/basic-event-room-options.sts2.fixture.yaml
  - dev.assert:
      path: run.currentRoom.event
      exists: true
  - dev.assert:
      path: actions[args.eventOptionId=event-room:gain-gold:0].kind
      source: actions
      equals: select-event-option
  - dev.assert:
      path: run.currentRoom.event.playerStates[0].options[1].id
      equals: event-room:leave:1
