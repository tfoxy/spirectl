name: non-combat-intent-actions
description: Exercises intent-first non-combat actions against deterministic mock fixtures.
steps:
  - dev.load-fixture:
      path: ../../fixtures/basic-rewards.sts2.fixture.yaml
  # state has no top-level `rewards` document, and the mock transport doesn't
  # populate `run.players[].overlays[].rewards` content for a loaded fixture
  # (see cli/src/bridge/mock_data/state_run.rs `mock_overlays`) — ownership/
  # perspective on a specific reward item isn't independently assertable here.
  # The overlay's own screenType is real and confirms the rewards screen loaded.
  - dev.assert:
      path: run.players[id=p1].overlays[0].screenType
      equals: Rewards
  - act.claim-reward:
      reward: reward:p1:0
  - dev.load-fixture:
      path: ../../fixtures/basic-card-selection.sts2.fixture.yaml
  - act.select-card:
      card: card-selection:card:bash:0
  - dev.load-fixture:
      path: ../../fixtures/basic-shop.sts2.fixture.yaml
  # state has no `shop.purchasableItems`; shop entries split into
  # characterCardEntries/relicEntries/potionEntries/cardRemovalEntry under
  # run.currentRoom.shop.inventory, which the mock transport doesn't populate for
  # a loaded fixture either — the room's own scene identity is what's real here.
  - dev.assert:
      path: run.currentRoom.scene
      equals: rooms/shop_room
  - act.buy-card:
      shopItem: shop:p1:card:strike:0
  - act.leave-shop: {}
  - dev.load-fixture:
      path: ../../fixtures/rest-site.sts2.fixture.yaml
  - act.rest: {}
  - act.use-rest-site-option:
      restOption: heal
  - dev.load-fixture:
      path: ../../fixtures/treasure.sts2.fixture.yaml
  - act.open-chest: {}
  - act.take-relic:
      relic: anchor
  - dev.load-fixture:
      path: ../../fixtures/basic-map.sts2.fixture.yaml
  - act.select-map-node:
      node: map-node:3:1
  - act.back-from-map: {}
  - dev.load-fixture:
      path: ../../fixtures/basic-event-room.sts2.fixture.yaml
  - act.select-event-option:
      eventOption: event-room:gain-gold:0
