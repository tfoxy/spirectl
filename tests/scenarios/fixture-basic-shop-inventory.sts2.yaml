name: fixture-basic-shop-inventory
description: Loads the checked-in shop inventory fixture through the live bridge and asserts the resulting merchant screen.
steps:
  - dev.load-fixture:
      path: ../../fixtures/basic-shop-inventory.sts2.fixture.yaml
  - dev.assert:
      path: run.currentRoom.scene
      equals: rooms/shop_room
  - dev.assert:
      path: run.currentRoom.shop
      exists: true
  # `leave-shop` (a room-exit action, like proceed-treasure-room/back-from-map) has
  # no native `state actions` surfacer yet — out of scope for this migration
  # (only surface_shop's purchasable-item actions were added).
  - dev.assert:
      path: run.currentRoom.shop.inventory.characterCardEntries[id~=^shop:].id
      exists: true
  - dev.assert:
      path: actions[args.shopItemId~=^shop:].kind
      source: actions
      exists: true
