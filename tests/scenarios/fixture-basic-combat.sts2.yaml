name: fixture-basic-combat
description: Loads the checked-in combat fixture through the live bridge and asserts the resulting combat screen.

steps:
  - dev.load-fixture:
      path: ../../fixtures/basic-combat.sts2.fixture.yaml

  - dev.assert:
      path: run.currentRoom.scene
      equals: rooms/combat_room

  - dev.assert:
      path: run.currentActIndex
      equals: 0

  - dev.assert:
      path: run.players[0].characterId
      equals: ironclad
