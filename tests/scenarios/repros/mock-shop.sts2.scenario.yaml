      - shop:p1:relic:anchor:0
      - shop:p1:potion:fire-potion:0
      - shop:p1:card-removal:0
      - shop:leave
    availableActionKinds:
      - choose
  choices:
    - id: shop:p1:card:strike:0
      choiceKind: shop
      intentKind: choose
      label: Strike
      description: Buy Strike.
      ownerPlayerId: p1
      perspective:
