[package]
name = "sts2"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
build = "build.rs"

[dependencies]
bytes = "1.10.1"
clap = { version = "4.5.38", features = ["derive", "env"] }
clap_complete = "4.5.46"
http-body-util = "0.1.3"
hyper = { version = "1.7.0", features = ["http1", "server"] }
prost = "0.13.5"
prost-types = "0.13.5"
percent-encoding = "2.3.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
shlex = "1.3.0"
regex = "1.12.2"
image = { version = "0.25.10", default-features = false, features = ["png", "webp", "exr", "hdr"] }
hyper-util = { version = "0.1.17", features = ["tokio"] }
tokio = { version = "1.43.0", features = ["macros", "net", "rt-multi-thread"] }
tonic = { version = "0.12.3", features = ["transport"] }
base64 = "0.22.1"
reqwest = { version = "0.12.20", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10.9"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
tungstenite = { version = "0.24.0", default-features = false, features = ["handshake"] }
tokio-stream = { version = "0.1.17", features = ["net"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55.0"

[dev-dependencies]
tempfile = "3.16.0"

[build-dependencies]
protoc-bin-vendored = "3.1.0"
tonic-build = "0.12.3"
