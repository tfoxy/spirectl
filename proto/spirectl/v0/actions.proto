message ConfirmSelectionAction {
  // Optional: confirm a CLIENT-staged selection (e.g. the deck-card-removal
  // preview). When present, the host stages these cards (by their state card id)
  // before confirming — folding staging+confirm into one call, mirroring
  // ConfirmHandSelectionAction. Empty preserves the original behavior (confirm
  // whatever the host already has staged).
  string player_id = 1;
  repeated string card_ids = 2;
  // Optional: the stable reward id (reward:<player-id>:visible:<index> /
  // reward:<player-id>:<reward-set-index>) when this confirm commits a
  // per-player undoable card-REMOVAL reward that was opened client-side (no host
  // selection screen). The bridge engages the owning player's reward directly and
  // removes card_ids[0] from that player's deck. Empty preserves the original
  // live-screen staging+confirm behavior.
  string reward_id = 3;
}

message CancelSelectionAction {
}

message ClaimRewardAction {
  string reward_id = 1;
  string player_id = 2;
}

message SkipRewardsAction {
  string player_id = 1;
}

message SelectCardAction {
  string card_id = 1;
  string player_id = 2;
  // Optional: the stable reward id when this select commits a per-player undoable
  // card-CHOICE reward opened client-side (no host selection screen). The bridge
  // engages the owning player's reward directly and adds the chosen offered card
  // (card_id carries the synthetic card:...:<index> id) to that player's deck.
  // Empty preserves the original live card-selection-screen behavior.
  string reward_id = 3;
}

