// Open the combat draw pile viewer (the in-game NCardPileScreen). The pile
// cards are already in run.players[].combat.drawPile; this opens the screen.
message ViewDrawPileAction {
  string player_id = 1;
}

// Open the combat discard pile viewer (the in-game NCardPileScreen).
message ViewDiscardPileAction {
  string player_id = 1;
}

// Open the combat exhaust pile viewer (the in-game NCardPileScreen).
message ViewExhaustPileAction {
  string player_id = 1;
}

// Open the relic-details overlay (the in-game NInspectRelicScreen) for a
// relic-bar relic. relic_id is the stable id from
// state.run.players[].relics[].id (a bare relic model id is also accepted).
message InspectRelicAction {
  string relic_id = 1;
  string player_id = 2;
}

// Close the open relic-details overlay (the in-game NInspectRelicScreen),
// mirroring its backdrop press.
message CloseInspectRelicAction {
  string player_id = 1;
}

// Stage a hand card while in-hand selection mode is active
// (state.run.view.handSelection, e.g. Survivor's "Discard 1 card.").
// card_id is the stable id from run.players[].combat.hand.cards[].id.
// Selecting while already at maxSelect mirrors the game UI: the most
// recently selected card is swapped out.
message SelectHandCardAction {
  string card_id = 1;
  string player_id = 2;
}

// Unstage a previously selected hand card. Not available in upgrade-select
// mode (the game UI swaps instead of deselecting there).
message DeselectHandCardAction {
  string card_id = 1;
  string player_id = 2;
}

// Confirm the staged in-hand selection (the hand's confirm button). Legal
// once handSelection.canConfirm is true; resolves the awaiting card effect
// (e.g. Survivor discards the staged card).
//
// card_ids lets a caller stage the selection AND confirm in one call: any
// listed card not already staged on the host is staged (as if by
// SelectHandCardAction) before the confirm fires. This supports clients that
// keep selection purely local (no per-click host round-trip) and only contact
// the host at confirm time. When empty, the host confirms whatever is already
// staged (the original behavior).
message ConfirmHandSelectionAction {
  string player_id = 1;
  repeated string card_ids = 2;
}

// Draw a freeform stroke on the map (NMapDrawings) as the local player. `points` are in
// TheMap content space (the same space the read RPC returns); the bridge inverse-
// transforms them to NMapDrawings-local and calls the game's BeginLine /
// UpdateCurrentLinePosition / StopLine, which broadcast to peers (no new netcode).
// `is_eraser` draws an eraser stroke (SetDrawingModeLocal(Erasing) first). `player_id`
// must be the local player — you cannot draw as another player; used for ownership
// validation only (the stroke always routes through the local player's NMapDrawings).
message DrawMapStrokeAction {
  string player_id = 1;
  bool is_eraser = 2;
  repeated Point points = 3;
}

// Clear all of the local player's map drawings (NMapDrawings.ClearDrawnLinesLocal).
message ClearMapDrawingsAction {
  string player_id = 1;
}

// Dev-only host-side heal (`sts2 dev heal`). Directly mutates a creature's HP through
// the game's CreatureCmd on the host — NOT a legal player move, never advertised in
// availableActions. Healing a dead creature revives it (the game's Heal/SetCurrentHp semantics).
// In real networked multiplayer a host-direct mutation can desync remote ENet clients; intended
// for the couch-coop norm of one real player plus synthetic seats.
message HealAction {
  // Target creature id (`creature:<combatId>` — the same ids `sts2 state` shows for players,
  // allies, and enemies). Empty = the acting seat's own player creature.
  string target_id = 1;
  // HP to restore (clamped to max by the game). Ignored when full=true.
  int32 amount = 2;
  // Set current HP to max instead of adding amount.
  bool full = 3;
}

enum RawMouseButton {
  RAW_MOUSE_BUTTON_UNSPECIFIED = 0;
  RAW_MOUSE_BUTTON_LEFT = 1;
  RAW_MOUSE_BUTTON_RIGHT = 2;
  RAW_MOUSE_BUTTON_MIDDLE = 3;
}

message MouseClickAction {
  int32 x = 1;
  int32 y = 2;
  RawMouseButton button = 3;
}

message ActionResponse {
  string request_id = 1;
  string action_instance_id = 2;
  ActionKind kind = 3;
  bool accepted = 4;
  bool provisional = 5;
  string message = 6;
}

message ActionResponseV0 {
  string request_id = 1;
  string action_instance_id = 2;
  ActionKind kind = 3;
  bool accepted = 4;
  bool provisional = 5;
  string message = 6;
  ActionLegalityStatus legality_status = 7;
  string owner_player_id = 8;
  string perspective = 9;
  repeated string checked_hook_paths = 10;
  RemoteClientOrchestrationCapability remote_orchestration = 11;
