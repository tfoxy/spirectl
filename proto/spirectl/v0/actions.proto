message ActionDescriptorV0 {
  string id = 1;
  ActionKind kind = 2;
  string summary = 3;
  string cli_command_hint = 4;
  bool provisional = 5;
  ActionStatus status = 6;
  ActionKindDescriptor kind_descriptor = 7;
  string owner_player_id = 8;
  ActionPerspectiveBehavior perspective_behavior = 9;
  ActionLegalityStatus legality_status = 10;
  repeated string checked_hook_paths = 11;
  repeated ActionArgumentSchema argument_schema = 12;
  repeated ActionFailureReasonCode failure_reason_codes = 13;
  RemoteClientOrchestrationCapability remote_orchestration = 14;
  MultiplayerRole owner_role = 15;
}

message ActionParameter {
  string name = 1;
  string value_type = 2;
  bool required = 3;
  string summary = 4;
}

message ActionKindDescriptor {
  ActionKind kind = 1;
  string intent_kind = 2;
  string command_name = 3;
  string summary = 4;
  bool fallback = 5;
  bool dangerous = 6;
  repeated string modes = 7;
  repeated string screen_types = 8;
}

message ActionArgumentSchema {
  string name = 1;
  ActionArgumentValueType value_type = 2;
  bool required = 3;
  string summary = 4;
  repeated string allowed_values = 5;
  bool stable_id = 6;
}

enum ActionArgumentValueType {
  ACTION_ARGUMENT_VALUE_TYPE_UNSPECIFIED = 0;
  ACTION_ARGUMENT_VALUE_TYPE_STRING = 1;
  ACTION_ARGUMENT_VALUE_TYPE_STABLE_ID = 2;
  ACTION_ARGUMENT_VALUE_TYPE_PLAYER_ID = 3;
  ACTION_ARGUMENT_VALUE_TYPE_CARD_ID = 4;
  ACTION_ARGUMENT_VALUE_TYPE_POTION_ID = 5;
  ACTION_ARGUMENT_VALUE_TYPE_TARGET_ID = 6;
  ACTION_ARGUMENT_VALUE_TYPE_CHOICE_ID = 7;
  ACTION_ARGUMENT_VALUE_TYPE_MAP_NODE_ID = 8;
  ACTION_ARGUMENT_VALUE_TYPE_CHARACTER_ID = 9;
  ACTION_ARGUMENT_VALUE_TYPE_INT32 = 10;
  ACTION_ARGUMENT_VALUE_TYPE_ENUM = 11;
  ACTION_ARGUMENT_VALUE_TYPE_BOOL = 12;
}

enum ActionPerspectiveBehavior {
