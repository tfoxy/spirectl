syntax = "proto3";

package spirectl.v0;

option csharp_namespace = "Spirectl.Proto.V0";

enum TransportKind {
  TRANSPORT_KIND_UNSPECIFIED = 0;
  TRANSPORT_KIND_MOCK = 1;
  TRANSPORT_KIND_IPC = 2;
  TRANSPORT_KIND_TCP = 3;
  TRANSPORT_KIND_EMBEDDED = 4;
}

enum AttachmentState {
  ATTACHMENT_STATE_UNSPECIFIED = 0;
  ATTACHMENT_STATE_STUBBED = 1;
  ATTACHMENT_STATE_DETACHED = 2;
  ATTACHMENT_STATE_ATTACHED = 3;
}

enum PerspectiveScope {
  PERSPECTIVE_SCOPE_UNSPECIFIED = 0;
  PERSPECTIVE_SCOPE_LOCAL = 1;
  PERSPECTIVE_SCOPE_OMNISCIENT = 2;
}

enum MultiplayerRole {
  MULTIPLAYER_ROLE_UNSPECIFIED = 0;
  MULTIPLAYER_ROLE_LOCAL = 1;
  MULTIPLAYER_ROLE_HOST = 2;
  MULTIPLAYER_ROLE_REMOTE = 3;
  MULTIPLAYER_ROLE_HOST_LOCAL_SEAT = 4;
}

enum RemoteClientOrchestrationState {
  REMOTE_CLIENT_ORCHESTRATION_STATE_UNSPECIFIED = 0;
  REMOTE_CLIENT_ORCHESTRATION_STATE_UNAVAILABLE = 1;
  REMOTE_CLIENT_ORCHESTRATION_STATE_LOCAL_ONLY_DEGRADED = 2;
  REMOTE_CLIENT_ORCHESTRATION_STATE_HOST_MEDIATED = 3;
  REMOTE_CLIENT_ORCHESTRATION_STATE_CONFIGURED_CLIENT = 4;
  REMOTE_CLIENT_ORCHESTRATION_STATE_UNSUPPORTED = 5;
  REMOTE_CLIENT_ORCHESTRATION_STATE_HOST_LOCAL_SEAT = 6;
}

message PerspectiveSelector {
  PerspectiveScope scope = 1;
  string player_id = 2;
}

message PerspectiveInfo {
  PerspectiveScope scope = 1;
  string player_id = 2;
  bool uses_default = 3;
  MultiplayerRole local_role = 4;
  string local_player_id = 5;
  string host_player_id = 6;
  RemoteClientOrchestrationCapability remote_orchestration = 7;
}

message ScreenInfo {
  reserved 1;
  reserved "type";
  string title = 2;
  string screen_instance_id = 3;
  string source = 4;
  string raw_type = 5;
  string class_name = 6;
  string id = 7;
}

message Capability {
  string id = 1;
  string summary = 2;
  bool provisional = 3;
  RemoteClientOrchestrationCapability remote_orchestration = 4;
}

message RemoteClientOrchestrationCapability {
  string id = 1;
  RemoteClientOrchestrationState state = 2;
  string summary = 3;
  bool provisional = 4;
}

enum ActionKind {
  ACTION_KIND_UNSPECIFIED = 0;
  ACTION_KIND_PLAY_CARD = 1;
  ACTION_KIND_CHOOSE = 2;
  ACTION_KIND_END_TURN = 3;
  ACTION_KIND_READY = 4;
  ACTION_KIND_UNREADY = 5;
  ACTION_KIND_SELECT_CHARACTER = 6;
  ACTION_KIND_SELECT_MAP_NODE = 7;
  ACTION_KIND_MOUSE_CLICK = 8;
  ACTION_KIND_USE_POTION = 9;
  ACTION_KIND_CONFIRM_SELECTION = 10;
  ACTION_KIND_CANCEL_SELECTION = 11;
  ACTION_KIND_CLAIM_REWARD = 12;
  ACTION_KIND_SKIP_REWARDS = 13;
  ACTION_KIND_SELECT_CARD = 14;
  ACTION_KIND_SKIP_CARD_SELECTION = 15;
  ACTION_KIND_SELECT_BUNDLE = 16;
  ACTION_KIND_BUY_CARD = 17;
  ACTION_KIND_BUY_RELIC = 18;
  ACTION_KIND_BUY_POTION = 19;
  ACTION_KIND_REMOVE_CARD = 20;
  ACTION_KIND_LEAVE_SHOP = 21;
  ACTION_KIND_CLOSE_SHOP_INVENTORY = 22;
  ACTION_KIND_REST = 23;
  ACTION_KIND_SMITH = 24;
  ACTION_KIND_USE_REST_SITE_OPTION = 25;
  ACTION_KIND_PROCEED_REST_SITE = 26;
  ACTION_KIND_OPEN_CHEST = 27;
  ACTION_KIND_TAKE_RELIC = 28;
  ACTION_KIND_PROCEED_TREASURE_ROOM = 29;
  ACTION_KIND_BACK_FROM_MAP = 30;
  ACTION_KIND_SELECT_EVENT_OPTION = 31;
  ACTION_KIND_OPEN_EVENT_SHOP = 32;
  ACTION_KIND_USE_CRYSTAL_SPHERE_CONTROL = 33;
  ACTION_KIND_PROCEED_EVENT = 34;
  ACTION_KIND_JOIN_LOBBY_PLAYER = 35;
  ACTION_KIND_LEAVE_LOBBY_PLAYER = 36;
  ACTION_KIND_TOGGLE_MAP = 37;
  ACTION_KIND_TOGGLE_DECK = 38;
  ACTION_KIND_TOGGLE_SETTINGS = 39;
  ACTION_KIND_SORT_DECK_VIEW = 40;
  ACTION_KIND_TOGGLE_DECK_VIEW_UPGRADES = 41;
  ACTION_KIND_OPEN_POTION_POPUP = 42;
  ACTION_KIND_START_POTION_TARGETING = 43;
  ACTION_KIND_SELECT_TARGET = 44;
  ACTION_KIND_DISCARD_POTION = 45;
  ACTION_KIND_VIEW_DRAW_PILE = 46;
  ACTION_KIND_VIEW_DISCARD_PILE = 47;
  ACTION_KIND_VIEW_EXHAUST_PILE = 48;
  ACTION_KIND_CANCEL_END_TURN = 49;
  ACTION_KIND_INSPECT_RELIC = 50;
  ACTION_KIND_CLOSE_INSPECT_RELIC = 51;
  ACTION_KIND_SELECT_HAND_CARD = 52;
  ACTION_KIND_DESELECT_HAND_CARD = 53;
  ACTION_KIND_CONFIRM_HAND_SELECTION = 54;
  ACTION_KIND_DRAW_MAP_STROKE = 55;
  ACTION_KIND_CLEAR_MAP_DRAWINGS = 56;
  // Dev-only host-side heal (sts2 dev heal). Not a legal player action; never advertised in
  // availableActions. Appended additively — never renumber existing kinds.
  ACTION_KIND_HEAL = 57;
}

enum ActionStatus {
  ACTION_STATUS_UNSPECIFIED = 0;
  ACTION_STATUS_IMPLEMENTED = 1;
  ACTION_STATUS_SCAFFOLDED = 2;
}

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_TRACE = 1;
  LOG_LEVEL_DEBUG = 2;
  LOG_LEVEL_INFO = 3;
  LOG_LEVEL_WARN = 4;
  LOG_LEVEL_ERROR = 5;
}

enum DataSource {
  DATA_SOURCE_UNSPECIFIED = 0;
  DATA_SOURCE_STUB = 1;
  DATA_SOURCE_LIVE = 2;
}
