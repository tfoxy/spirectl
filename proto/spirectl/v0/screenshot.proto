syntax = "proto3";

package spirectl.v0;

option csharp_namespace = "Spirectl.Proto.V0";

import "spirectl/v0/common.proto";
import "spirectl/v0/errors.proto";

message ScreenshotRequest {
  uint32 viewport_width = 1;
  uint32 viewport_height = 2;
}

message ScreenshotResponse {
  DataSource source = 1;
  bool provisional = 2;
  string format = 3;
  uint32 width = 4;
  uint32 height = 5;
  bytes contents = 6;
  string screen_type = 7;
  string screen_instance_id = 8;
  uint32 requested_viewport_width = 9;
  uint32 requested_viewport_height = 10;
  uint32 applied_viewport_width = 11;
  uint32 applied_viewport_height = 12;
  bool restored_viewport = 13;
  uint32 restored_viewport_width = 14;
  uint32 restored_viewport_height = 15;
}

message ScreenshotResult {
  oneof result {
    ScreenshotResponse success = 1;
    BridgeError error = 2;
  }
}
