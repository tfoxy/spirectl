syntax = "proto3";

package spirectl.v0;

option csharp_namespace = "Spirectl.Proto.V0";

import "spirectl/v0/common.proto";
import "spirectl/v0/errors.proto";

message ConsoleCommandRequest {
  string request_id = 1;
  string command = 2;
  repeated string args = 3;
  string line = 4;
}

message ConsoleCommandNotice {
  string code = 1;
  string message = 2;
  bool provisional = 3;
}

message ConsoleCommandResponse {
  string request_id = 1;
  string command = 2;
  repeated string args = 3;
  string line = 4;
  bool accepted = 5;
  bool success = 6;
  string output = 7;
  repeated string output_lines = 8;
  DataSource source = 9;
  bool provisional = 10;
  repeated ConsoleCommandNotice notices = 11;
}

message ConsoleCommandResult {
  oneof result {
    ConsoleCommandResponse success = 1;
    BridgeError error = 2;
  }
}
