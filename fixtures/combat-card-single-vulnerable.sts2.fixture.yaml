name: combat-card-single-vulnerable
description: >-
  Single-target attack (Bash, AnyEnemy) selected against Vulnerable Nibbits. Unlike the
  all-enemies Whirlwind case, the boosted number is driven by FOCUS, not by arming: hover/aim
  the selected Bash at an enemy and its displayed damage updates to that enemy's value (higher
  against a Vulnerable target than the card's authored 8), matching the in-game single-target
  preview and the SelectionReticle / HP-bar preview, which also light on focus alone.
  A low-HP encounter is used so the HP-bar preview segment is clearly visible. Vulnerable is a
  target power, so the at-rest card number stays at the authored 8 until an enemy is targeted.
