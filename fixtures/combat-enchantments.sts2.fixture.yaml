schemaVersion: spirectl.fixture/v0
name: combat-enchantments
description: >-
  Ironclad combat showcasing card enchantments: 10 enchanted cards in hand and the draw
  pile filled with one card per enchantment (all of them). Cards are paired to satisfy the
  game's CanEnchant rules (SHARP/INSTINCT/VIGOROUS are Attack-only, IMBUED is Skill-only).
run:
  seed: fixture-combat-enchantments
  players:
    - id: "p:1"
      characterId: IRONCLAD
      creature: { currentHp: 67, maxHp: 80 }
      # Master deck (the top-bar Deck viewer): replace the Ironclad starter with one card
      # per enchantment, so the deck viewer shows all 22 enchantments instead of the starter.
      deck:
        replace: true
        cards:
          - { modelId: STRIKE_IRONCLAD, enchantmentId: ADROIT, enchantAmount: 2 }
          - { modelId: STRIKE_IRONCLAD, enchantmentId: CLONE }
