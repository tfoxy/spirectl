name: combat-card-multiattack-vulnerable-mixed
description: >-
  combat-card-multiattack with Vulnerable on only the FIRST Nibbit; the second is
  unaffected. Whirlwind hits all enemies, so the per-enemy HP-bar damage preview differs
  across the board — the Vulnerable Nibbit shows a wider orange "will-lose" segment
  than the other one, which shows the base-damage segment. A low-HP encounter is used so the
  difference is clearly visible. Exercises the mixed-target case the card's single number
  cannot represent on its own.
